name: EAS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eas-build:
    name: Production Android build (EAS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    # Only builds when the EAS project is wired up (EXPO_TOKEN set, exposed
    # via a job-level env so an undefined secret doesn't fail the run).
    # Implementations without an EAS account/project stay green by skipping
    # the build step.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install deps
        run: npm ci
      - name: EAS Build (production, Android)
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npx eas-cli build --platform android --profile production --non-interactive