appId: host.exp.exponent
name: me-tab-and-data-privacy
# Establishes its own state: if the app is still at the auth/onboarding screen
# (e.g. a prior ignored flow failed), run onboarding first; otherwise rely on
# the existing Home state. Then drives the Me screen via stable testIDs instead
# of case-transformed section-title text.
---
- runFlow:
    when:
      visible: "Welcome to Mausam"
    file: 01-onboarding.yaml
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- assertVisible:
    id: "me-screen"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "local-encrypted-database"
    direction: DOWN
    speed: 60
    timeout: 30000
- assertVisible:
    id: "local-encrypted-database"
- scrollUntilVisible:
    element:
      id: "export-data-button"
    direction: DOWN
    speed: 60
    centerElement: true
    timeout: 30000
- tapOn:
    id: "export-data-button"
# With EXPO_PUBLIC_E2E=1 the app skips the OS share chooser; on other runs
# close it (title comes from the Sharing dialogTitle) so the in-app status
# line becomes the active window again.
- runFlow:
    when:
      visible: "Export my data"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "data-export-prepared"
    timeout: 20000
- assertVisible:
    id: "data-export-prepared"