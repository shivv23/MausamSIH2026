appId: host.exp.exponent
name: alerts-notification-centre
# Requires auth-and-onboarding to have run (Home is visible).
# Opens the Alerts tab and verifies the official/derived/Info already-rendered
# notification centre.
---
- tapOn:
    id: "tab-alerts"
- extendedWaitUntil:
    visible:
      id: "alerts-screen"
    timeout: 15000
- assertVisible:
    id: "alerts-subtitle"