appId: host.exp.exponent
name: myday-add-activity
# Requires auth-and-onboarding to have run (Home is visible).
# Opens My Day, adds a popular activity (one the Ananya demo hasn't used)
# and verifies the instant re-score toast.
---
- tapOn:
    id: "tab-myday"
- extendedWaitUntil:
    visible:
      id: "myday-screen"
    timeout: 15000
- tapOn:
    id: "add-activity-button"
- scrollUntilVisible:
    element:
      id: "activity-evening-walk"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "activity-evening-walk"
- extendedWaitUntil:
    visible: "✓ Added — re-scored instantly"
    timeout: 15000
- assertVisible: "✓ Added — re-scored instantly"