appId: host.exp.exponent
name: auth-and-onboarding
# Signs in via offline-demo mode and completes the DPDP consent onboarding.
# No backend required (demo mode is served purely from the emulator).
---
- runFlow:
    when:
      visible: "Allow Expo Go to access this device's location?"
    commands:
      - tapOn:
          text: "ALLOW"
          optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Welcome to Mausam"
    timeout: 45000
- tapOn: "Continue without account (offline demo)"
# Stale app state can land directly on Home, while a fresh run shows the
# onboarding screen; accept either destination and continue to the final Home
# state instead of failing on a missing intermediate selector.
- extendedWaitUntil:
    visible:
      id: "offline-onboarding-screen"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "offline-onboarding-screen"
    commands:
      - tapOn: "Fitness"
      - scrollUntilVisible:
          element:
            text: "Accept & continue.*"
          direction: DOWN
          timeout: 30000
      - tapOn: "Accept & continue.*"
      - extendedWaitUntil:
          visible: "Home"
          timeout: 15000
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000